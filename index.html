<!DOCTYPE html>
<html lang="pt-br" class="light">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks</title>
    <link rel="stylesheet" href="style.css" />
    <!-- rel= relacionamento, dps do = é tag/arquivo href = atributo/referência-->
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <div id="avatar">
          <img
            src="./assets/avatar.png"
            alt="foto de Luis Gabriel, com leve sorriso, usando óculo com plantas ao fundo"
          />
          <p>@luis.gabriel_f</p>
        </div>
        <div id="userAt"></div>
      </div>

      <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
      </div>

      <!-- ul= lista desordenada (pontinhos), ol= lista ordenada (Sequênica de números) -->
      <ul>
        <li>
          <a href="https://luisfigueiredoux.figma.site/" target="_blank"
            >Portfólio</a
          >
        </li>

        <li>
          <a href="https://www.linkedin.com/in/luisgfigueiredo/" target="_blank"
            >LinkedIn</a
          >
        </li>

        <li>
          <a href="https://medium.com/@LuisGFigueiredo" target="_blank"
            >Artigos no Medium</a
          >
        </li>
      </ul>
      <div id="social-links">
        <a href="https://luisfigueiredoux.figma.site/" target="_blank">
          <ion-icon name="globe-outline"></ion-icon>
        </a>

        <a href="https://www.linkedin.com/in/luisgfigueiredo/" target="_blank">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>

        <a href="https://www.instagram.com/luis.gabriel_f/" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a href="https://medium.com/@LuisGFigueiredo" target="_blank">
          <ion-icon name="logo-medium"></ion-icon>
        </a>
      </div>
      <footer>
        Feita com ❤️ pela
        <a href="https://www.rocketseat.com.br" target="_blank">Rocketseat</a>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
